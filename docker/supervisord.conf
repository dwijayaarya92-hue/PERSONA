; ==========================================
; Persona - Supervisor Configuration
; Laravel 12 + PHP 8.2 + Nginx
; ==========================================

[supervisord]

nodaemon=true

user=root

logfile=/var/log/supervisord.log

pidfile=/var/run/supervisord.pid


; ==========================================
; PHP-FPM
; ==========================================

[program:php-fpm]

command=/usr/local/sbin/php-fpm --nodaemonize

priority=10

autostart=true

autorestart=true

startsecs=5

stopasgroup=true

killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ==========================================
; Nginx
; ==========================================

[program:nginx]

command=/usr/sbin/nginx -g "daemon off;"

priority=20

autostart=true

autorestart=true

startsecs=5

stopasgroup=true

killasgroup=true

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0