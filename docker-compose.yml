services:

  # ========================================
  # PERSONA - Laravel Application
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8099:80"

    environment:

      # ----------------------------------------
      # Laravel
      # ----------------------------------------
      APP_NAME: "Persona"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://persona.skb-prime.web.id"
      APP_KEY: ${APP_KEY}

      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      APP_FAKER_LOCALE: id_ID

      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: 12

      # ----------------------------------------
      # Database
      # ----------------------------------------
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel12
      DB_USERNAME: laravel
      DB_PASSWORD: laravel_password

      # ----------------------------------------
      # Session
      # ----------------------------------------
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "true"

      # ----------------------------------------
      # Cache & Queue
      # ----------------------------------------
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      # ----------------------------------------
      # Broadcast
      # ----------------------------------------
      BROADCAST_CONNECTION: log

      # ----------------------------------------
      # Filesystem
      # ----------------------------------------
      FILESYSTEM_DISK: local

      # ----------------------------------------
      # Logging
      # ----------------------------------------
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_DEPRECATIONS_CHANNEL: null
      LOG_LEVEL: error

      # ----------------------------------------
      # Redis
      # ----------------------------------------
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: null
      REDIS_PORT: 6379

      # ----------------------------------------
      # Memcached
      # ----------------------------------------
      MEMCACHED_HOST: 127.0.0.1

      # ----------------------------------------
      # Mail
      # ----------------------------------------
      MAIL_MAILER: log
      MAIL_SCHEME: null
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 2525
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_FROM_ADDRESS: "hello@example.com"
      MAIL_FROM_NAME: "${APP_NAME}"

      # ----------------------------------------
      # AWS
      # ----------------------------------------
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ""
      AWS_USE_PATH_STYLE_ENDPOINT: "false"

      # ----------------------------------------
      # Vite
      # ----------------------------------------
      VITE_APP_NAME: "Persona"

      # ----------------------------------------
      # SweetAlert
      # ----------------------------------------
      SWEET_ALERT_THEME: bootstrap-4
      SWEET_ALERT_CONFIRM_DELETE_CONFIRM_BUTTON_TEXT: "Hapus Data"

    volumes:
      - persona_storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

    networks:
      - persona_network


  # ========================================
  # PERSONA - MySQL Database
  # ========================================
  db:
    image: mysql:8.0

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel12
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - persona_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - persona_network


# ========================================
# Volumes
# ========================================
volumes:

  persona_mysql_data:
    driver: local

  persona_storage:
    driver: local


# ========================================
# Networks
# ========================================
networks:

  persona_network:
    driver: bridge