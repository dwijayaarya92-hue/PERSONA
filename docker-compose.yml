version: "3.8"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8099:80"

    environment:
      APP_NAME: "Persona"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "https://persona.skb-prime.web.id"
      APP_KEY: "base64:NWq6QkCEv+Gio0pGm9vjvBnWlQfFPcC3nmDJXbW9zAg="
      APP_LOCALE: "id"
      APP_FALLBACK_LOCALE: "id"
      APP_FAKER_LOCALE: "id_ID"
      APP_MAINTENANCE_DRIVER: "file"
      BCRYPT_ROUNDS: "12"
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "laravel12"
      DB_USERNAME: "laravel"
      DB_PASSWORD: "laravel_password"
      SESSION_DRIVER: "database"
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"
      SESSION_PATH: "/"
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: "database"
      QUEUE_CONNECTION: "database"
      BROADCAST_CONNECTION: "log"
      FILESYSTEM_DISK: "local"
      LOG_CHANNEL: "stack"
      LOG_STACK: "single"
      LOG_DEPRECATIONS_CHANNEL: ""
      LOG_LEVEL: "error"
      REDIS_CLIENT: "phpredis"
      REDIS_HOST: "127.0.0.1"
      REDIS_PASSWORD: ""
      REDIS_PORT: "6379"
      MEMCACHED_HOST: "127.0.0.1"
      MAIL_MAILER: "log"
      MAIL_HOST: "127.0.0.1"
      MAIL_PORT: "2525"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_ADDRESS: "hello@example.com"
      MAIL_FROM_NAME: "Persona"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_BUCKET: ""
      AWS_USE_PATH_STYLE_ENDPOINT: "false"
      VITE_APP_NAME: "Persona"
      SWEET_ALERT_THEME: "bootstrap-4"
      SWEET_ALERT_CONFIRM_DELETE_CONFIRM_BUTTON_TEXT: "Hapus Data"

    volumes:
      - persona_storage:/var/www/html/storage

    depends_on:
      db:
        condition: service_healthy

    networks:
      - persona_network

  db:
    image: "mysql:8.0"

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: "laravel12"
      MYSQL_USER: "laravel"
      MYSQL_PASSWORD: "laravel_password"
      MYSQL_ROOT_PASSWORD: "root_password"

    volumes:
      - persona_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: "10s"
      timeout: "5s"
      retries: "10"
      start_period: "30s"

    networks:
      - persona_network

volumes:
  persona_mysql_data:
    driver: local
  persona_storage:
    driver: local

networks:
  persona_network:
    driver: bridge
